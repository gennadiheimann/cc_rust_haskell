# Ansparzeit in Monaten
saving_time_mounthly = 156
# Ansparrate monatlich in Euro
saving_rate = 250
# Darlehenphase = loan_phase
#Fest Sollzins in %
fixed_interest_rate_decimal = 0.0229
# Zins- und Tilgungsbeitrag monatlich in %
interest_prinipal_paymants_mounthly_decimal = 0.006
# Zinsfaktor für Bewertungszahl
interest_factor = 350
# Mindestbewertungszahl
minimum_evaluation_score = 214
# Zusaetzliche Ansparraten
[[bsv.additional_payments]]
payment = 5000
moment = 60
[[bsv.additional_payments]]
payment = 5000
moment = 120
# Zwischenfinanzierung Ansparung
# Ratenkredit
[bsv.interim_loan]
interest_rate_decimal = 0.07
duration_in_month = 120

